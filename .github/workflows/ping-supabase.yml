# Supabase pausa los proyectos gratis después de 7 días sin uso.
# Esto le hace una consulta mínima todos los días para que siga despierto.
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 11 * * *"   # todos los días, 8:17 de Argentina
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la base
        run: |
          curl -sf -X POST "https://hiejcxcvwgailprvxmtt.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_7sCjiK7hc-RceSskMVUPkA_ydagCYbp" \
            -H "Content-Type: application/json" -d '{}'
